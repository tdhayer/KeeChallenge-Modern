name: CI

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]   # release.yml handles tag pushes
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore KeeChallenge/src/KeeChallenge.csproj

      - name: Build
        run: dotnet build KeeChallenge/src/KeeChallenge.csproj -c Release /nologo /clp:ErrorsOnly

      - name: Verify output artifact exists
        shell: pwsh
        run: |
          $dll = "KeeChallenge/src/bin/Release/net48/KeeChallenge.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Expected artifact not found: $dll"
            exit 1
          }
          Write-Host "Artifact verified: $dll"
