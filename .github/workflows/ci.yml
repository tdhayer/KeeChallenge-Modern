name: CI

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]   # release.yml handles tag pushes
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore KeeChallenge/src/KeeChallenge.csproj

      - name: Build
        run: dotnet build KeeChallenge/src/KeeChallenge.csproj -c Release /nologo /clp:ErrorsOnly

      - name: Verify output artifact exists
        shell: pwsh
        run: |
          $dll = "KeeChallenge/src/bin/Release/net48/KeeChallenge.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Expected artifact not found: $dll"
            exit 1
          }
          Write-Host "Artifact verified: $dll"

      - name: Run regression matrix
        shell: powershell
        run: .\scripts\test.ps1
