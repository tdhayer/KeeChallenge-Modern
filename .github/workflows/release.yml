name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '8.x'   # SDK used to build net48 targets

      - name: Build
        run: dotnet build KeeChallenge/src/KeeChallenge.csproj -c Release /nologo /clp:ErrorsOnly

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "KeeChallenge-Modern-${version}.zip"
          Compress-Archive -Path @(
            "KeeChallenge/src/bin/Release/net48/KeeChallenge.dll",
            "KeeChallenge/lib/32bit",
            "KeeChallenge/lib/64bit",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.md"
          ) -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash.ToLower()
          $checksumFile = "$env:ZIP_NAME.sha256"
          "$hash  $env:ZIP_NAME" | Set-Content -Encoding utf8NoBOM $checksumFile
          echo "CHECKSUM_FILE=$checksumFile" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.CHECKSUM_FILE }}
          generate_release_notes: false
          body_path: ''   # leave blank to paste notes manually, or point to a file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
