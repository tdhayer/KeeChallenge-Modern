name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.x'   # SDK used to build net48 targets

      - name: Build
        run: dotnet build KeeChallenge/src/KeeChallenge.csproj -c Release /nologo /clp:ErrorsOnly

      - name: Run regression matrix
        shell: powershell
        run: .\scripts\test.ps1

      - name: Verify release metadata
        shell: pwsh
        run: |
          $dll = "KeeChallenge\src\bin\Release\net48\KeeChallenge.dll"
          $version = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $dll).Path).Version.ToString(3)
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag does not match assembly version $version."
          }
          if (-not (Test-Path "docs\releases\v$version.md")) {
            throw "Release notes missing for $version."
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "KeeChallenge-Modern-${version}.zip"
          Compress-Archive -Path @(
            "KeeChallenge/src/bin/Release/net48/KeeChallenge.dll",
            "KeeChallenge/lib/32bit",
            "KeeChallenge/lib/64bit",
            "docs/releases/${version}.md",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.md"
          ) -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash.ToLower()
          $checksumFile = "$env:ZIP_NAME.sha256"
          "$hash  $env:ZIP_NAME" | Set-Content -Encoding utf8NoBOM $checksumFile
          echo "CHECKSUM_FILE=$checksumFile" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.CHECKSUM_FILE }}
          generate_release_notes: false
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
