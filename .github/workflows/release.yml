name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '8.x'   # SDK used to build net48 targets

      - name: Build
        run: dotnet build KeeChallenge/src/KeeChallenge.csproj -c Release /nologo /clp:ErrorsOnly

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "KeeChallenge-Modern-${version}.zip"
          Compress-Archive -Path @(
            "KeeChallenge/src/bin/Release/net48/KeeChallenge.dll",
            "KeeChallenge/lib/32bit",
            "KeeChallenge/lib/64bit",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.md"
          ) -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash.ToLower()
          $checksumFile = "$env:ZIP_NAME.sha256"
          "$hash  $env:ZIP_NAME" | Set-Content -Encoding utf8NoBOM $checksumFile
          echo "CHECKSUM_FILE=$checksumFile" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.CHECKSUM_FILE }}
          generate_release_notes: false
          body_path: ''   # leave blank to paste notes manually, or point to a file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
